name: CI

on:
  push:
  pull_request:

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn torch torchvision pillow pyyaml

      - name: Smoke test
        run: |
          python - <<EOF
          from fastapi import FastAPI
          print("CI smoke test passed")
          EOF
